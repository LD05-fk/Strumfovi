amily="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.667" x="119" y="488.4561">arhivirana prilika ne mijenja status ovom rutom.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.1016" x="119" y="504.8076">Isti status i svi ostali prijelazi su zabranjeni.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.2515" x="119" y="521.1592">Automatsko zatvaranje dodaje OPP-04-BE1.</text></g><g class="entity" data-entity="GMN8" data-source-line="26" data-uid="ent0009" id="entity_GMN8"><path d="M106,584.6094 L106,602.1094 L88.1523,606.1094 L106,610.1094 L106,627.3125 A0,0 0 0 0 106,627.3125 L372.6606,627.3125 A0,0 0 0 0 372.6606,627.3125 L372.6606,594.6094 L362.6606,584.6094 L106,584.6094 A0,0 0 0 0 106,584.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M362.6606,584.6094 L362.6606,594.6094 L372.6606,594.6094 L362.6606,584.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.6606" x="112" y="603.1045">FINISHED nije dopu&#353;ten cilj rute za status.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.8296" x="112" y="619.4561">Objavu rezultata dodaje zaseban zadatak.</text></g><g class="link" data-entity-1=".start." data-entity-2="PREPARATION" data-uid="lnk4" id="link_.start._PREPARATION"><polygon fill="#181818" points="206.5,148.0656,210.5,139.0656,206.5,143.0656,202.5,139.0656,206.5,148.0656" style="stroke:#181818;stroke-width:1;"/><path d="M206.5,74.6857 C206.5,92.2077 206.5,120.5356 206.5,142.0656" fill="none" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.4917" x="208.5" y="108.1045">stvaranje nacrta</text></g><g class="link" data-entity-1="PREPARATION" data-entity-2="