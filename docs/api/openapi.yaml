components:
  schemas:
    PastExhibitionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        year:
          type: integer
          format: int32
          minimum: 1900
        place:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - place
      - title
      - year
    PastExhibitionDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        year:
          type: integer
          format: int32
        place:
          type: string
    LocationInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - PHYSICAL
          - ONLINE
        streetAddress:
          type: string
          maxLength: 200
          minLength: 0
        city:
          type: string
          maxLength: 100
          minLength: 0
        postalCode:
          type: string
          maxLength: 10
          minLength: 0
        latitude:
          type: number
          maximum: 90
          minimum: -90
        longitude:
          type: number
          maximum: 180
          minimum: -180
        onlineUrl:
          type: string
          maxLength: 1024
          minLength: 0
      required:
      - type
    OpportunityInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 3
        description:
          type: string
          maxLength: 10000
          minLength: 1
        typeId:
          type: string
          format: uuid
        artFieldIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 1
        deadline:
          type: string
          format: date-time
        criteria:
          type: string
          maxLength: 5000
          minLength: 0
        prize:
          type: string
          maxLength: 2000
          minLength: 0
        location:
          $ref: '#/components/schemas/LocationInput'
        eventStart:
          type: string
          format: date-time
        eventEnd:
          type: string
          format: date-time
      required:
      - artFieldIds
      - deadline
      - description
      - location
      - title
      - typeId
    CatalogRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    LocationDto:
      type: object
      properties:
        type:
          type: string
          enum:
          - PHYSICAL
          - ONLINE
        streetAddress:
          type: string
        city:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        onlineUrl:
          type: string
    OpportunityDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/CatalogRef'
        artFields:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRef'
        deadline:
          type: string
          format: date-time
        criteria:
          type: string
        prize:
          type: string
        location:
          $ref: '#/components/schemas/LocationDto'
        eventStart:
          type: string
          format: date-time
        eventEnd:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PREPARATION
          - OPEN
          - CLOSED
          - SELECTION
          - FINISHED
        archived:
          type: boolean
        hiddenByAdmin:
          type: boolean
        organizer:
          $ref: '#/components/schemas/OrganizerSummary'
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hasResults:
          type: boolean
        myApplicationId:
          type: string
          format: uuid
    OrganizerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        organizationName:
          type: string
    OrganizerProfileUpdateRequest:
      type: object
      properties:
        organizationName:
          type: string
          maxLength: 200
          minLength: 0
    OrganizerProfileDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        organizationName:
          type: string
        organizerApproval:
          type: string
          enum:
          - PENDING
          - APPROVED
    ArtistLinkRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 60
          minLength: 0
        url:
          type: string
          maxLength: 1024
          minLength: 0
      required:
      - url
    ArtistProfileUpdateRequest:
      type: object
      properties:
        biography:
          type: string
          maxLength: 5000
          minLength: 0
        artistStatement:
          type: string
          maxLength: 5000
          minLength: 0
        artFieldIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 0
        links:
          type: array
          items:
            $ref: '#/components/schemas/ArtistLinkRequest'
          maxItems: 10
          minItems: 0
      required:
      - artFieldIds
      - links
    ArtistLink:
      type: object
      properties:
        label:
          type: string
        url:
          type: string
    ArtistProfileDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
        biography:
          type: string
        artistStatement:
          type: string
        artFields:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRef'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ArtistLink'
    ArtworkRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 0
        year:
          type: integer
          format: int32
          minimum: 1900
        technique:
          type: string
          maxLength: 200
          minLength: 0
        dimensions:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
          maxLength: 5000
          minLength: 0
        visibility:
          type: string
          enum:
          - PUBLIC
          - PRIVATE
      required:
      - technique
      - title
      - visibility
      - year
    ArtworkDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        artistId:
          type: string
          format: uuid
        title:
          type: string
        year:
          type: integer
          format: int32
        technique:
          type: string
        dimensions:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum:
          - PUBLIC
          - PRIVATE
        hiddenByAdmin:
          type: boolean
        images:
          type: array
          items:
            $ref: '#/components/schemas/ArtworkImageDto'
        createdAt:
          type: string
          format: date-time
    ArtworkImageDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        file:
          $ref: '#/components/schemas/StoredFileDto'
        altText:
          type: string
    StoredFileDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        url:
          type: string
