# Profil prod (docker-compose.prod.yml): JSON zapisi za Dozzle i docker logs
server:
  servlet:
    session:
      cookie:
        # U produkciji preglednik šalje sesiju samo preko HTTPS-a.
        secure: true
logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.zaxxer.hikari: WARN
artconnect:
  storage:
    root: ${ARTCONNECT_STORAGE_ROOT:/data/uploads}
  geocoding:
    base-url: ${ARTCONNECT_GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${ARTCONNECT_GEOCODING_USER_AGENT:ArtConnect/1.0 (+https://artconnect-fer.duckdns.org)}
    min-interval: ${ARTCONNECT_GEOCODING_MIN_INTERVAL:1s}
    max-wait: ${ARTCONNECT_GEOCODING_MAX_WAIT:2s}
