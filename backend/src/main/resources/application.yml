spring:
  application:
    name: ArtConnect
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
        write-dates-with-context-time-zone: false
        adjust-dates-to-context-time-zone: false
  servlet:
    multipart:
      # Gornji limiti uploada prema PORT-04-BE1 (#104).
      max-file-size: 50MB
      max-request-size: 51MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/artconnect}
    username: ${DB_USER:artconnect}
    password: ${DB_PASSWORD:artconnect}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    # Bez postavljenih konteksta Liquibase primjenjuje sve changesetove
    contexts: dev
    parameters:
      adminEmail: ${ARTCONNECT_ADMIN_EMAIL:}
  session:
    # Sesija istječe nakon osam sati bez aktivnosti.
    timeout: 8h
    jdbc:
      # Shemu sesija stvara Liquibase (changes/001-spring-session.yaml)
      initialize-schema: never
server:
  servlet:
    session:
      cookie:
        name: SESSION
        # JavaScript ne smije čitati identifikator sesije.
        http-only: true
        same-site: lax
        # Lokalno koristimo HTTP; profil prod uključuje Secure za HTTPS.
        secure: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
