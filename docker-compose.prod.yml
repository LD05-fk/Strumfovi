# Produkcija (EC2): baza + backend + Caddy (servira frontend i proxya API).
# Imagee gradi i objavljuje CD (.github/workflows/cd.yml) u GitHub Container Registry;
# poslužitelj ih povlači: docker compose -f docker-compose.prod.yml pull && ... up -d
# IMAGE_TAG u .env: latest (zadano) ili sha commita za povratak na stariju inačicu.
# Rezervni ručni deploy bez registryja: docker compose -f docker-compose.prod.yml up -d --build

# Zapisi svih kontejnera rotiraju se: najviše 5 datoteka po 10 MB
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:?postavi DB_NAME u .env}
      POSTGRES_USER: ${DB_USER:?postavi DB_USER u .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?postavi DB_PASSWORD u .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # port se namjerno ne izlaže prema van

  backend:
    image: ghcr.io/ld05-fk/artconnect-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # iza Caddyja: koristi X-Forwarded-* zaglavlja (OAuth redirecti, HTTPS)
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # preskače changesete s kontekstom "dev" (demo podaci)
      SPRING_LIQUIBASE_CONTEXTS: prod
      # JSON zapisi (application-prod.yml)
      SPRING_PROFILES_ACTIVE: prod
      ARTCONNECT_STORAGE_ROOT: /data/uploads
      ARTCONNECT_GEOCODING_BASE_URL: ${ARTCONNECT_GEOCODING_BASE_URL:-https://nominatim.openstreetmap.org}
      ARTCONNECT_GEOCODING_USER_AGENT: ${ARTCONNECT_GEOCODING_USER_AGENT:-ArtConnect/1.0 (+https://artconnect-fer.duckdns.org)}
      ARTCONNECT_GEOCODING_MIN_INTERVAL: ${ARTCONNECT_GEOCODING_MIN_INTERVAL:-1s}
      ARTCONNECT_GEOCODING_MAX_WAIT: ${ARTCONNECT_GEOCODING_MAX_WAIT:-2s}
      # e-mail prvog administratora; prazno = ne stvara se nitko
      ARTCONNECT_ADMIN_EMAIL: ${ARTCONNECT_ADMIN_EMAIL:-}
      # OAuth klijent za Google prijavu (AUTH-01-BE1)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - uploads:/data/uploads
    # port se namjerno ne izlaže prema van, dostupan je samo Caddyju

  caddy:
    image: ghcr.io/ld05-fk/artconnect-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend
      - dozzle
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # prijava na /logs (Dozzle); hash iz: docker run --rm caddy:2 caddy hash-password
      LOGS_USER: ${LOGS_USER:?postavi LOGS_USER u .env}
      LOGS_PASSWORD_HASH: ${LOGS_PASSWORD_HASH:?postavi LOGS_PASSWORD_HASH u .env}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

  # Pregled zapisa svih kontejnera u pregledniku, na /logs iza Caddyja (basic_auth).
  # Samo čitanje: akcije i shell su isključeni, port se ne izlaže.
  dozzle:
    image: amir20/dozzle:v11
    restart: unless-stopped
    logging: *logging
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
